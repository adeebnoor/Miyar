# Owner confirmed My Workspace for this deployment on 13 September 2026.
# Free database is an evaluation resource with expiry, not a durable production commitment.
services:
  - type: web
    name: miyar-enterprise-api
    repo: https://github.com/adeebnoor/Miyar
    branch: main
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: miyar-enterprise-db
          property: connectionString
      - key: MIYAR_ENV
        value: production
      - key: MIYAR_JWT_SECRET
        generateValue: true
      - key: MIYAR_CORS_ORIGINS
        value: https://adeebnoor.github.io
      - key: MIYAR_ENABLE_EMBEDDINGS
        value: "false"
      - key: MIYAR_SERVE_UI
        value: "true"
      - key: MIYAR_BOOTSTRAP_EMAIL
        value: admin@miyar.example
      - key: MIYAR_BOOTSTRAP_PASSWORD
        generateValue: true
      - key: MIYAR_SIGNING_KEY
        generateValue: true
# A separate long-running worker may run `python -m server.worker` on provisioned capacity.
databases:
  - name: miyar-enterprise-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []
