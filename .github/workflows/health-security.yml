name: Operational health and dependency review
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-health:
    runs-on: ubuntu-latest
    steps:
      - name: Observe live services without sending business data
        run: |
          curl --fail --silent --show-error --retry 2 --max-time 100 https://miyar-enterprise-api.onrender.com/health > /tmp/health.json
          python - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          assert h['status']=='ok'
          print('Point-in-time observation:', h['version'], h.get('buildId','legacy'))
          print('Process-only counters:', h.get('operations',{}))
          PY
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Review Node dependency advisories
        run: npm audit --audit-level=high
      - name: Review Python dependency advisories
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r server/requirements-lock.txt --progress-spinner off
