name: Test and deploy Miyar to GitHub Pages

on:
  push:
    branches: [main, fix/qa-review-2026-09-15]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Retire the old group held by a cancelled, runnerless release attempt.
  # Continue serializing tests per ref and cancelling superseded attempts.
  group: release-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miyar_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: miyar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miyar_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-lock.txt
      - name: Install API and export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          pip install -r server/requirements-lock.txt
      - name: Test enterprise API against PostgreSQL
        env:
          MIYAR_TEST_POSTGRES_URL: postgresql+psycopg://miyar_test:ephemeral-ci-only@localhost:5432/miyar_test
        run: python -m pytest server/tests -q --disable-warnings
      - name: Verify pinned Python dependencies have no known advisories
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r server/requirements-lock.txt --progress-spinner off
      - name: Verify the real local semantic index and memory budget
        env:
          MIYAR_MODEL_CACHE: /tmp/miyar-local-semantic-ci
          ORT_DISABLE_TELEMETRY: '1'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -m server.build_semantic_index
          python scripts/check-local-semantic-resources.py
      - name: Retain actual model resource verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-semantic-resource-evidence
          path: test-results/local-semantic-resources.json
          retention-days: 14
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify generated release is current
        run: |
          npm run build
          git diff --exit-code -- dist/release.json dist/index.html package.json package-lock.json
      - name: Test classification, position workflow and interface
        run: npm test
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install free Playwright browser runner
        timeout-minutes: 10
        run: |
          # The runner's Azure Ubuntu mirror can stall dependency downloads.
          # Use the same signed Ubuntu archive and retain every failure gate.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com/ubuntu/?|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99-miyar-ci-network >/dev/null <<'APT_CONFIG'
          Acquire::Retries "1";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          APT_CONFIG
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-lock.txt
      - name: Install isolated authenticated browser API
        run: pip install -r server/requirements-lock.txt
      - name: Serve Miyar locally
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/miyar-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/miyar-http.log
          exit 1
      - name: Test the first-user journey in a real browser
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/acceptance-results.json
        run: npx playwright test e2e/*.spec.cjs --reporter=line,json --workers=1
      - name: Check external reference links without submitting data
        if: always()
        run: python3 scripts/check-external-links.py
      - name: Retain functional acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-acceptance-evidence
          path: test-results/
          retention-days: 14

  release-checks:
    name: All release checks passed
    if: always()
    needs: [server-test, ui-test, e2e-test]
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require every release test gate to succeed
        env:
          SERVER_RESULT: ${{ needs.server-test.result }}
          UI_RESULT: ${{ needs.ui-test.result }}
          E2E_RESULT: ${{ needs.e2e-test.result }}
        run: |
          python3 - <<'PYTHON'
          import os
          results = {name: os.environ[name] for name in ['SERVER_RESULT', 'UI_RESULT', 'E2E_RESULT']}
          assert all(value == 'success' for value in results.values()), results
          print('Server, interface and real-browser release checks passed')
          PYTHON
