name: Test and deploy Miyar to GitHub Pages

on:
  push:
    branches: [main, fix/qa-review-2026-09-15]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: miyar_test
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: miyar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U miyar_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-lock.txt
      - name: Install API and export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          pip install -r server/requirements-lock.txt
      - name: Test enterprise API against PostgreSQL
        env:
          MIYAR_TEST_POSTGRES_URL: postgresql+psycopg://miyar_test:ephemeral-ci-only@localhost:5432/miyar_test
        run: python -m pytest server/tests -q --disable-warnings
  ui-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test classification, position workflow and interface
        run: npm test
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [server-test, ui-test]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
